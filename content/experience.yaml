schemaVersion: 1

# Locale-independent facts sit on the entry. Anything a reader must read in
# their own language sits under `content.<locale>`. Array order is the rendered
# timeline order, so no separate order field exists to drift from it.
entries:
  - id: "pt-piramida-mobile-developer-intern-2025"
