    technologies:
      - "Flutter"
      - "Riverpod"
      - "Socket.IO"
      - "Google Maps"
      - "Figma"
    content:
      en:
        title: "Mobile Developer Intern"
        period: "Jul 2025-Dec 2025"
        organizationNote: "Remote · Surabaya"
        description: "Worked as the sole Mobile Developer in a four-person cross-functional team, covering interface development, API integration, and manual testing of a Flutter application prototype."
        contributions:
          - "Designed mobile interfaces and user flows with Figma."
          - "Developed Flutter interfaces and application flows as the team's sole Mobile Developer."
          - "Collaborated with backend developers to integrate REST APIs and real-time updates."
          - "Implemented application state management, authentication-based navigation, and local session storage."
          - "Integrated location features with Google Maps and manually tested customer and driver flows on Android."
      id:
        title: "Mobile Developer Intern"
        period: "Jul 2025-Des 2025"
        organizationNote: "Jarak jauh · Surabaya"
        description: "Bekerja sebagai satu-satunya Mobile Developer dalam tim lintas peran beranggotakan empat orang, mencakup pengembangan antarmuka, integrasi API, dan pengujian manual prototipe aplikasi Flutter."
        contributions:
          - "Mendesain antarmuka mobile dan alur pengguna dengan Figma."
          - "Mengembangkan antarmuka Flutter dan alur aplikasi sebagai satu-satunya Mobile Developer di tim."
          - "Berkolaborasi dengan backend developer untuk mengintegrasikan REST API dan pembaruan real-time."
          - "Mengimplementasikan state management aplikasi, navigasi berdasarkan status autentikasi, dan penyimpanan session lokal."
          - "Mengintegrasikan fitur lokasi dengan Google Maps dan menguji alur pelanggan serta pengemudi secara manual di Android."

  - id: "mitra-informatika-mobile-developer-intern-2025"
    type: experience
    organization: "Mitra Informatika"
    technologies:
      - "Flutter"
      - "WebSocket"
      - "WebRTC"
      - "Riverpod"
      - "Isar"
    content:
      en:
        title: "Mobile Developer Intern"
        period: "Jan 2025-Jun 2025"
        organizationNote: "On-site · Surabaya"
        description: "Worked as one of two Mobile Developers in a six-person cross-functional team, contributing to Flutter development and real-time communication features."
        contributions:
          - "Developed and refined Flutter interfaces, reusable components, and application state management."
          - "Migrated real-time communication from Socket.IO to WebSocket, including message dispatching, reconnect handling, and user activity status."
          - "Built personal voice and video call prototypes with WebRTC, covering signaling, media streams, and call-state management."
          - "Implemented message search, filtering, and chat-room pagination, and contributed to attachment handling and group interfaces."
      id:
        title: "Mobile Developer Intern"
        period: "Jan 2025-Jun 2025"
        organizationNote: "Di kantor · Surabaya"
        description: "Bekerja sebagai salah satu dari dua Mobile Developer dalam tim lintas peran beranggotakan enam orang, berkontribusi pada pengembangan Flutter dan fitur komunikasi real-time."
        contributions:
          - "Mengembangkan dan menyempurnakan antarmuka Flutter, komponen yang dapat dipakai ulang, dan state management aplikasi."
          - "Memigrasikan komunikasi real-time dari Socket.IO ke WebSocket, termasuk pengiriman pesan, penanganan koneksi ulang, dan status aktivitas pengguna."
          - "Membangun prototipe panggilan suara dan video pribadi dengan WebRTC, mencakup signaling, media stream, dan pengelolaan call state."
          - "Mengimplementasikan pencarian pesan, filter, dan pagination ruang chat, serta berkontribusi pada penanganan lampiran dan antarmuka grup."

  - id: "education-d4-informatics"
    type: education
    organization: "Politeknik Elektronika Negeri Surabaya"
    technologies:
      - "Docker"
      - "CI/CD"
      - "Linux"
      - "Research"
    content:
      en:
        title: "Bachelor of Applied Computer Science (Informatics Engineering)"
        period: "2021-2026"
        organizationNote: null
        description: "Completed an applied undergraduate degree through academic software projects, industry internships, and research activities with the Cyber Security Research Group (CSRG)."
        contributions:
          - "Developed FMS-CREATE's passenger mobile app and an operator fleet-telemetry prototype as my final academic project within the Cyber Security Research Group (CSRG)."
          - "Developed application interfaces and features, integrated REST APIs, and implemented real-time communication. Studied UI/UX design, data management, manual and automated software testing, infrastructure and application deployment fundamentals, and the use of AI in software development."
          - "Named as one of the creators on two software copyright registrations, with Politeknik Elektronika Negeri Surabaya as the copyright holder."
          - "Participated in HIMIT PENS student association activities, including external relations and student events."
      id:
        title: "Sarjana Terapan Teknik Informatika"
        period: "2021-2026"
        organizationNote: null
        description: "Menyelesaikan pendidikan sarjana terapan melalui proyek perangkat lunak akademik, magang industri, dan kegiatan riset bersama Cyber Security Research Group (CSRG)."
        contributions:
          - "Mengembangkan aplikasi mobile penumpang FMS-CREATE dan prototipe telemetri armada untuk operator sebagai tugas akhir dalam Cyber Security Research Group (CSRG)."
          - "Mengembangkan antarmuka dan fitur aplikasi, mengintegrasikan REST API, serta menerapkan komunikasi real-time. Mempelajari perancangan UI/UX, pengelolaan data, pengujian perangkat lunak secara manual dan otomatis, dasar infrastruktur dan deployment aplikasi, serta pemanfaatan AI dalam pengembangan perangkat lunak."
          - "Tercatat sebagai salah satu pencipta pada dua pencatatan hak cipta perangkat lunak, dengan Politeknik Elektronika Negeri Surabaya sebagai pemegang hak cipta."
          - "Berpartisipasi dalam kegiatan himpunan mahasiswa HIMIT PENS, termasuk hubungan eksternal dan acara kemahasiswaan."
